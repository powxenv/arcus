<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcus: You are the arc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   ARCUS : PLAYFUL BRUTALIST DESIGN SYSTEM
   Font: Archivo (display) + system-ui (body)
   Color: OKLCH, light, vibrant. No purple. No cream.
   ═══════════════════════════════════════════════════════════════ */
:root {
  /* Neutrals : clean white, not cream */
  --bg: oklch(0.99 0.002 60);
  --surface: oklch(0.97 0.003 60);
  --surface-2: oklch(0.94 0.004 60);
  --ink: oklch(0.18 0.012 280);
  --ink-2: oklch(0.42 0.01 280);
  --ink-3: oklch(0.56 0.008 280);
  --line: oklch(0.18 0.012 280 / 0.12);

  /* Brand : warm coral (no purple) */
  --brand: oklch(0.60 0.22 35);
  --brand-2: oklch(0.50 0.20 35);
  --brand-soft: oklch(0.94 0.04 35);

  /* Test colors */
  --solstice: oklch(0.64 0.21 42);
  --solstice-soft: oklch(0.94 0.05 42);
  --turing: oklch(0.58 0.14 230);
  --turing-soft: oklch(0.94 0.03 230);
  --pride: oklch(0.56 0.24 5);
  --pride-soft: oklch(0.94 0.06 5);
  --passage: oklch(0.58 0.15 162);
  --passage-soft: oklch(0.94 0.04 162);

  /* Brutalist elements */
  --bw: 2.5px;
  --bw-thin: 1.5px;
  --r: 10px;
  --r-sm: 6px;
  --r-pill: 999px;
  --sh: 4px 4px 0 var(--ink);
  --sh-sm: 2px 2px 0 var(--ink);
  --sh-lg: 6px 6px 0 var(--ink);
  --t: 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
  --display: 'Archivo', system-ui, sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--body); background: var(--bg); color: var(--ink);
  line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.1; letter-spacing: -0.025em; }
h1 { font-weight: 800; }
h2 { font-weight: 800; }
h3 { font-weight: 700; }
h4 { font-weight: 600; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; }
*:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--ink-3); border-radius: var(--r-pill); border: 2px solid var(--bg); }

@media (prefers-reduced-motion: no-preference) {
  .fade-in { animation: fadeIn 0.25s cubic-bezier(0.2,0.8,0.2,1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

/* ─── LAYOUT ─── */
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2rem); }
.wrap-narrow { max-width: 680px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2rem); }
.section { padding: clamp(2.5rem, 6vw, 4rem) 0; }

/* ─── NAV ─── */
nav {
  position: sticky; top: 0; z-index: 60;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.75rem clamp(1rem, 4vw, 2rem);
  background: oklch(0.99 0.002 60 / 0.88);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: var(--bw-thin) solid var(--line);
}
.logo { font-family: var(--display); font-size: 1.3rem; font-weight: 900; letter-spacing: -0.03em; display: flex; align-items: center; gap: 0.3rem; }
.logo-dot { width: 12px; height: 12px; background: var(--brand); border-radius: 50%; border: 2px solid var(--ink); }
.nav-links { display: flex; gap: 0.25rem; align-items: center; }
.nav-link {
  font-size: 0.85rem; font-weight: 600; padding: 0.45rem 0.8rem;
  border-radius: var(--r-sm); border: none; background: none; color: var(--ink-2);
  transition: all var(--t);
}
.nav-link:hover { background: var(--surface); color: var(--ink); }
.nav-link.active { background: var(--ink); color: var(--bg); }
.nav-dots { display: flex; gap: 4px; margin-left: 0.5rem; }
.ndot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background var(--t); }
.ndot.done { background: var(--brand); }

/* ─── BUTTONS ─── */
.btn {
  font-family: var(--display); font-size: 0.95rem; font-weight: 700;
  padding: 0.75rem 1.5rem; border-radius: var(--r-sm); border: var(--bw) solid var(--ink);
  transition: all var(--t); display: inline-flex; align-items: center; gap: 0.4rem;
}
.btn-primary { background: var(--brand); color: white; box-shadow: var(--sh); }
.btn-primary:hover { transform: translate(-2px,-2px); box-shadow: var(--sh-lg); }
.btn-primary:active { transform: none; box-shadow: var(--sh-sm); }
.btn-primary:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: var(--sh-sm); }
.btn-ink { background: var(--ink); color: var(--bg); box-shadow: var(--sh); }
.btn-ink:hover { transform: translate(-2px,-2px); box-shadow: var(--sh-lg); }
.btn-ink:active { transform: none; box-shadow: var(--sh-sm); }
.btn-outline { background: var(--bg); color: var(--ink); box-shadow: var(--sh); }
.btn-outline:hover { transform: translate(-2px,-2px); box-shadow: var(--sh-lg); }
.btn-ghost { border: none; background: none; color: var(--ink-3); padding: 0.5rem 0.75rem; font-weight: 600; }
.btn-ghost:hover { color: var(--ink); background: var(--surface); border-radius: var(--r-sm); }
.btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }

/* ─── CARDS ─── */
.card { background: var(--bg); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--sh); }
.card-soft { background: var(--surface); border: var(--bw-thin) solid var(--line); border-radius: var(--r); }

/* ─── TAG / PILL ─── */
.pill { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.78rem; font-weight: 700; padding: 0.3rem 0.7rem; border-radius: var(--r-pill); }
.pill-ink { background: var(--ink); color: var(--bg); }
.pill-brand { background: var(--brand-soft); color: var(--brand-2); }
.pill-done { background: oklch(0.92 0.08 145); color: oklch(0.35 0.12 145); }

/* ─── MISC ─── */
.divider { height: var(--bw-thin); background: var(--line); margin: 2rem 0; border: none; }
.kicker { font-family: var(--display); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.scope-note { font-size: 0.78rem; color: var(--ink-3); line-height: 1.5; max-width: 500px; margin: 2rem auto 0; text-align: center; }

/* ═══ LANDING ═══ */
.hero { padding: clamp(3rem, 8vw, 5rem) 0 2rem; text-align: center; position: relative; }
.hero h1 { font-size: clamp(2.8rem, 9vw, 5.5rem); font-weight: 900; }
.hero h1 .arc { color: var(--brand); }
.hero p { font-size: clamp(1rem, 2.5vw, 1.25rem); color: var(--ink-2); max-width: 520px; margin: 1rem auto 0; }
.hero-cta { margin-top: 1.75rem; display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
.hero-arcs { display: flex; justify-content: center; gap: clamp(0.5rem, 3vw, 2rem); margin-top: 2.5rem; }
.arc-deco { width: clamp(60px, 12vw, 100px); height: clamp(30px, 6vw, 50px); border: 4px solid; border-bottom: none; border-radius: 50% 50% 0 0; }
.landing-banner { display: inline-block; padding: 0.4rem 1rem; background: var(--brand-soft); color: var(--brand-2); font-weight: 700; font-size: 0.82rem; border-radius: var(--r-pill); margin-bottom: 1rem; }
.landing-section { padding: clamp(2rem, 5vw, 3.5rem) 0; border-top: var(--bw-thin) solid var(--line); }
.landing-section h2 { font-size: clamp(1.5rem, 4vw, 2.2rem); margin-bottom: 0.5rem; text-wrap: balance; }
.landing-section .lead { font-size: 1.05rem; color: var(--ink-2); margin-bottom: 1.5rem; max-width: 580px; }
.feature-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
.feature-item { padding: 1.5rem; border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--sh); }
.feature-item .emoji { font-size: 2rem; margin-bottom: 0.5rem; }
.feature-item h4 { font-size: 1.1rem; margin-bottom: 0.25rem; }
.feature-item p { font-size: 0.88rem; color: var(--ink-2); }

/* ═══ CONTENT PAGES (about, methodology, etc.) ═══ */
.page-hero { padding: clamp(2.5rem, 6vw, 4rem) 0 1.5rem; }
.page-hero h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 0.5rem; }
.page-hero p { font-size: 1.1rem; color: var(--ink-2); max-width: 600px; }
.prose { max-width: 680px; }
.prose h2 { font-size: 1.5rem; margin: 2rem 0 0.5rem; }
.prose h3 { font-size: 1.15rem; margin: 1.5rem 0 0.4rem; }
.prose p { margin-bottom: 1rem; color: var(--ink-2); }
.prose ul { margin-bottom: 1rem; padding-left: 1.25rem; }
.prose li { margin-bottom: 0.4rem; color: var(--ink-2); }
.prose strong { color: var(--ink); }

/* ═══ ASSESSMENT HUB ═══ */
.hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
.test-card {
  border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--sh);
  padding: 1.5rem; cursor: pointer; transition: all var(--t); background: var(--bg);
  display: flex; flex-direction: column; gap: 0.75rem; text-align: left; min-height: 220px;
}
.test-card:hover { transform: translate(-3px,-3px); box-shadow: var(--sh-lg); }
.test-card:active { transform: none; box-shadow: var(--sh-sm); }
.tc-top { display: flex; justify-content: space-between; align-items: flex-start; }
.tc-icon { font-size: 2rem; }
.tc-status { font-size: 0.72rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-3); }
.tc-status.done { background: var(--tc-soft); color: var(--tc-c); }
.test-card h3 { font-size: 1.3rem; }
.test-card .tc-blurb { font-size: 0.86rem; color: var(--ink-2); flex-grow: 1; }
.test-card .tc-foot { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--ink-3); }
.test-card .tc-result { color: var(--tc-c); font-weight: 700; }

/* ═══ ASSESSMENT OVERVIEW ═══ */
.ao-hero { padding: clamp(2.5rem, 5vw, 3.5rem) 0; border-bottom: var(--bw) solid var(--ink); }
.ao-hero h1 { font-size: clamp(2rem, 5vw, 3rem); display: flex; align-items: center; gap: 0.75rem; }
.ao-hero .ao-sub { font-size: 1.1rem; color: var(--ink-2); margin-top: 0.5rem; }
.ao-hero .ao-cta { margin-top: 1.5rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }
.ao-section { padding: 2rem 0; border-bottom: var(--bw-thin) solid var(--line); }
.ao-section:last-child { border: none; }
.ao-types { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
.ao-type-card { padding: 1.25rem; border: var(--bw-thin) solid var(--line); border-radius: var(--r); cursor: pointer; transition: all var(--t); background: var(--bg); }
.ao-type-card:hover { border-color: var(--ao-c); transform: translateY(-2px); box-shadow: var(--sh-sm); }
.ao-type-card .emoji { font-size: 1.5rem; margin-bottom: 0.25rem; }
.ao-type-card h4 { font-size: 1rem; margin-bottom: 0.2rem; }
.ao-type-card p { font-size: 0.8rem; color: var(--ink-3); line-height: 1.4; }

/* ═══ QUIZ ═══ */
.quiz-shell { min-height: 100vh; display: flex; flex-direction: column; }
.quiz-bar-wrap { max-width: 680px; margin: 0 auto; width: 100%; padding: 1.5rem clamp(1rem, 4vw, 2rem) 0; }
.quiz-bar { height: 8px; background: var(--surface-2); border-radius: var(--r-pill); overflow: hidden; }
.quiz-bar-fill { height: 100%; border-radius: var(--r-pill); transition: width 0.35s cubic-bezier(0.2,0.8,0.2,1); }
.quiz-meta { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: var(--ink-3); margin-top: 0.5rem; }
.quiz-center { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 1rem clamp(1rem, 4vw, 2rem); max-width: 680px; margin: 0 auto; width: 100%; }
.quiz-q { font-family: var(--display); font-size: clamp(1.25rem, 3.5vw, 1.6rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 2rem; text-wrap: balance; }
.quiz-poles { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--ink-2); font-weight: 500; margin-bottom: 0.5rem; }
.quiz-pips { display: flex; gap: 0.5rem; justify-content: center; }
.pip { width: clamp(40px, 11vw, 50px); height: clamp(40px, 11vw, 50px); border-radius: 50%; border: var(--bw) solid var(--ink); background: var(--bg); font-family: var(--display); font-weight: 700; font-size: 0.9rem; color: var(--ink-2); transition: all 120ms cubic-bezier(0.2,0.8,0.2,1); }
.pip:hover { background: var(--surface); transform: scale(1.08); }
.pip.sel { background: var(--q-c); color: white; border-color: var(--q-c); transform: scale(1.12); box-shadow: var(--sh-sm); }
.quiz-foot { max-width: 680px; margin: 0 auto; width: 100%; padding: 0 clamp(1rem, 4vw, 2rem) 1.5rem; display: flex; justify-content: space-between; }
.stance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.stance-opt { padding: 1.25rem; border: var(--bw) solid var(--ink); border-radius: var(--r); background: var(--bg); font-weight: 600; font-size: 0.95rem; text-align: center; transition: all var(--t); }
.stance-opt:hover { background: var(--surface); }
.stance-opt.sel { background: var(--q-c); color: white; }

/* ═══ RESULTS ═══ */
.result-page { max-width: 600px; margin: 0 auto; padding: clamp(2rem, 5vw, 3rem) clamp(1rem, 4vw, 2rem) 4rem; text-align: center; }
.r-emoji { font-size: clamp(3rem, 10vw, 4.5rem); line-height: 1; }
.r-type { font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 800; margin: 0.25rem 0; }
.r-theme { font-size: 0.82rem; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
.r-dir { display: inline-block; padding: 0.4rem 1rem; font-size: 0.82rem; font-weight: 700; border-radius: var(--r-pill); margin-bottom: 1.25rem; background: var(--r-soft); color: var(--r-c); }
.r-scores { text-align: left; margin-bottom: 1.5rem; }
.sr-row { margin-bottom: 0.75rem; }
.sr-lbl { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; }
.sr-track { height: 8px; background: var(--surface-2); border-radius: var(--r-pill); overflow: hidden; }
.sr-fill { height: 100%; border-radius: var(--r-pill); transition: width 0.6s cubic-bezier(0.2,0.8,0.2,1); }
.r-desc { font-size: 1.02rem; color: var(--ink-2); line-height: 1.7; max-width: 480px; margin: 0 auto 1.25rem; }
.r-closer { font-family: var(--display); font-size: 1.1rem; font-weight: 700; font-style: italic; padding-top: 1rem; border-top: var(--bw-thin) solid var(--line); max-width: 480px; margin: 0 auto 1.5rem; }
.r-actions { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }

/* ═══ TYPE PAGE ═══ */
.type-page { max-width: 680px; margin: 0 auto; padding: clamp(2rem, 5vw, 3rem) clamp(1rem, 4vw, 2rem) 4rem; }
.type-hero { text-align: center; margin-bottom: 2rem; }
.type-hero .emoji { font-size: 4rem; }
.type-hero h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin: 0.25rem 0; }
.type-hero p { color: var(--ink-2); font-size: 1.05rem; }
.type-nav { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
.type-nav-btn { font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.8rem; border: var(--bw-thin) solid var(--line); border-radius: var(--r-pill); background: var(--bg); color: var(--ink-3); transition: all var(--t); }
.type-nav-btn:hover { border-color: var(--ink); color: var(--ink); }
.type-nav-btn.cur { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.type-section { margin-bottom: 1.75rem; }
.type-section h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
.type-section p, .type-section li { font-size: 0.95rem; color: var(--ink-2); line-height: 1.6; }
.type-section ul { padding-left: 1.25rem; }
.type-section li { margin-bottom: 0.35rem; }

/* ═══ PROFILE ═══ */
.prof-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin: 1.5rem 0; }
.prof-card { padding: 1.25rem; border: var(--bw-thin) solid var(--line); border-radius: var(--r); cursor: pointer; transition: all var(--t); display: flex; align-items: center; gap: 0.75rem; background: var(--bg); }
.prof-card:hover { border-color: var(--pc); transform: translateY(-2px); box-shadow: var(--sh-sm); }
.prof-card.empty { opacity: 0.5; }
.prof-card .p-emoji { font-size: 1.5rem; }
.prof-card .p-info { flex-grow: 1; }
.prof-card .p-name { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); }
.prof-card .p-result { font-weight: 700; margin-top: 0.1rem; }
.prof-synth { padding: 1.5rem; background: var(--brand-soft); border-radius: var(--r); margin-bottom: 1.5rem; }
.prof-synth h3 { color: var(--brand-2); margin-bottom: 0.4rem; }
.prof-synth p { font-size: 0.9rem; color: var(--ink-2); }

/* ═══ FAQ ═══ */
.faq-item { border-bottom: var(--bw-thin) solid var(--line); padding: 1rem 0; cursor: pointer; }
.faq-item summary { font-weight: 700; font-size: 1rem; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.faq-item summary::after { content: '+'; font-size: 1.5rem; font-weight: 400; color: var(--ink-3); transition: transform var(--t); }
.faq-item[open] summary::after { transform: rotate(45deg); }
.faq-item p { margin-top: 0.75rem; color: var(--ink-2); font-size: 0.95rem; }

/* ═══ RESEARCH ═══ */
.ref-item { padding: 0.75rem 0; border-bottom: var(--bw-thin) solid var(--line); }
.ref-item .ref-title { font-weight: 600; font-size: 0.92rem; }
.ref-item .ref-use { font-size: 0.82rem; color: var(--ink-3); margin-top: 0.15rem; }

/* ═══ SHARE MODAL ═══ */
.modal-bg { display: none; position: fixed; inset: 0; z-index: 100; background: oklch(0.18 0.012 280 / 0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; padding: 1rem; }
.modal-bg.active { display: flex; }
.modal-card { width: 100%; max-width: 360px; padding: 2rem; text-align: center; background: var(--bg); border: var(--bw) solid var(--ink); border-radius: var(--r); box-shadow: var(--sh-lg); position: relative; }
.modal-close { position: absolute; top: 0.75rem; right: 0.75rem; width: 30px; height: 30px; border-radius: 50%; border: var(--bw-thin) solid var(--ink); background: var(--bg); font-size: 0.9rem; color: var(--ink-2); display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: var(--ink); color: white; }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 640px) {
  .nav-link { font-size: 0.78rem; padding: 0.35rem 0.6rem; }
  .nav-dots { display: none; }
  .hub-grid { grid-template-columns: 1fr; }
  .prof-grid { grid-template-columns: 1fr; }
  .stance-grid { grid-template-columns: 1fr; }
  .pip { width: 40px; height: 40px; font-size: 0.82rem; }
  .quiz-pips { gap: 0.35rem; }
}
</style>
</head>
<body>
<nav id="nav-bar" style="display:none;">
  <button class="logo" onclick="route('home')"><span class="logo-dot"></span>Arcus</button>
  <div class="nav-links">
    <button class="nav-link" data-route="assessments" onclick="route('assessments')">Assessments</button>
    <button class="nav-link" data-route="methodology" onclick="route('methodology')">Methodology</button>
    <button class="nav-link" data-route="about" onclick="route('about')">About</button>
    <div class="nav-dots" id="nav-dots"></div>
    <button class="nav-link" onclick="route('profile')">Profile</button>
  </div>
</nav>
<div id="app" class="fade-in"></div>
<div class="modal-bg" id="modal-bg"><div class="modal-card" id="modal-card"></div></div>

<script>
// ════════════════════════════════════════════════════════════════
// ARCUS: COMPLETE PRODUCT
// ════════════════════════════════════════════════════════════════
const D = {
  solstice: {

const S = {

  done(){return Object.keys(S.load()).filter(k=>D[k]).length}
};

// ─── ROUTER ───
function route(page,param){render(page,param);window.scrollTo(0,0);}
function render(page,param){
  const app=document.getElementById('app');
  app.classList.remove('fade-in');
  void app.offsetWidth;
  app.classList.add('fade-in');
  const nav=document.getElementById('nav-bar');
  if(page==='quiz'){nav.style.display='none';}
  else{nav.style.display='flex';}
  const pages={
    home:()=>pageHome(), about:()=>pageAbout(), assessments:()=>pageHub(),
    overview:()=>pageOverview(param), quiz:()=>pageQuiz(param), results:()=>pageResults(param),
    type:()=>pageType(param), methodology:()=>pageMethodology(), research:()=>pageResearch(),
    faq:()=>pageFAQ(), profile:()=>pageProfile()
  };
  app.innerHTML=(pages[page]||pages.home)();
  document.querySelectorAll('.nav-link').forEach(l=>{
    l.classList.toggle('active',l.dataset.route===page||(page==='overview'&&l.dataset.route==='assessments'));
  });
  updateNavDots();
}

function updateNavDots(){
  const d=S.load();
  document.getElementById('nav-dots').innerHTML=['solstice','turing','pride','passage']
    .map(k=>`<div class="ndot ${d[k]?'done':''}"></div>`).join('');
}

function pageQuiz(key){
  const t=D[key]; if(!t) return '';
  const q=quiz;
  const items=q.phase==='main'?t.items_data:(t.extra?t.extra.items:[]);
  const total=t.totalItems;
  const curNum=q.phase==='main'?q.idx+1:t.items_data.length+q.idx+1;
  document.documentElement.style.setProperty('--q-c',t.color);
  let bodyHtml='';
  if(q.phase==='extra'&&t.extra&&t.extra.type==='stance'){
    bodyHtml=`<div class="quiz-q" style="text-align:center">${t.extra.prompt}</div>
    <div class="stance-grid">${t.extra.items.map((s,i)=>
      `<button class="stance-opt ${q.extra[0]===s.value?'sel':''}" onclick="selStance('${s.value}')">${s.s}</button>`).join('')}</div>`;
  } else {
    const item=items[q.idx];
    const resp=q.phase==='main'?q.resp[q.idx]:q.extra[q.idx];
    const prompt=q.phase==='extra'&&q.idx===0?`<p style="text-align:center;color:var(--ink-2);font-size:0.9rem;margin-bottom:1.5rem;font-weight:500">${t.extra.prompt}</p>`:'';
    const pips=Array.from({length:t.extra&&t.extra.type==='bipolar'?7:5},(_,i)=>i+1).map(v=>
      `<button class="pip ${resp===v?'sel':''}" onclick="selAns(${v})" aria-label="${v}">${v}</button>`).join('');
    const points=q.phase==='main'?(key==='solstice'||key==='pride'?7:5):(t.extra.type==='bipolar'?7:5);
    bodyHtml=`${prompt}
      <div class="quiz-q">${item.s}</div>
      <div class="quiz-poles"><span>${item.a||''}</span><span style="text-align:right">${item.b||''}</span></div>
      <div class="quiz-pips">${Array.from({length:points},(_,i)=>i+1).map(v=>{
        const r=q.phase==='main'?q.resp[q.idx]:q.extra[q.idx];
        return `<button class="pip ${r===v?'sel':''}" onclick="selAns(${v})" aria-label="${v}">${v}</button>`;
      }).join('')}</div>`;
  }
  const isLast=q.phase==='extra'&&q.idx>=(t.extra?t.extra.items.length-1:0)||q.phase==='main'&&q.idx>=t.items_data.length-1&&!t.extra;
  return `<div class="quiz-shell">
    <div class="quiz-bar-wrap">
      <div class="quiz-bar"><div class="quiz-bar-fill" id="q-fill" style="width:${((curNum-1)/total)*100}%;background:${t.color}"></div></div>
      <div class="quiz-meta"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${t.color};margin-right:4px"></span>Arcus: ${t.name}</span><span>${curNum} / ${total}</span></div>
    </div>
    <div class="quiz-center">${bodyHtml}</div>
    <div class="quiz-foot">
      <button class="btn-ghost" onclick="prevQ()" ${(q.idx===0&&q.phase==='main')?'disabled':''}>← Back</button>
      <button class="btn btn-primary" style="background:${t.color}" id="q-next" onclick="${isLast?'finishQuiz()':'nextQ()'}" ${q.phase==='extra'&&t.extra&&t.extra.type==='stance'&&!q.extra[0]?'disabled':''}>
        ${isLast?'See result →':'Next →'}
      </button>
    </div>
  </div>`;
}

function pageMethodology(){
  return `<div class="wrap-narrow">
    <div class="page-hero"><span class="kicker">Methodology</span><h1>How Arcus works</h1><p>The research, the scoring, and the honesty.</p></div>
    <div class="prose">
      <h2>Research-grounded, not validated</h2>
      <p>Every construct Arcus measures is grounded in full-text-verified, peer-reviewed research. The instruments it draws from (Russell's circumplex, Campbell's Self-Concept Clarity Scale, Epstein's Rational-Experiential Inventory, Zimbardo's Time Perspective Inventory) are validated tools used in academic psychology.</p>
      <p>Arcus itself is <strong>not independently validated</strong>. It is theory-informed, not psychometrically evaluated. That line is stated on every result. A lightly validated instrument is worse than an honestly unvalidated one, because it implies false authority.</p>
      <h2>Four methodologies, not one</h2>
      <p>Each test uses a different measurement approach because each construct demands it:</p>
      <ul>
        <li><strong>Solstice</strong>: 7-point bipolar Likert for affective position + trajectory items for direction.</li>
        <li><strong>Turing</strong>: 5-point unipolar agree-disagree for NFC and FI + behavioral decision battery for decision-style preference.</li>
        <li><strong>Pride</strong>: 7-point bipolar Likert for clarity and authenticity + commitment items + opt-in informant path for visibility.</li>
        <li><strong>Passage</strong>: 5-point unipolar for temporal engagement + stance items for relationship with passage.</li>
      </ul>
      <h2>Scoring</h2>
      <p>Scoring is hierarchical and transparent. Item responses are normalized, averaged within facets, and scaled 0-100. Axis scores are facet means. Types are derived from threshold-based engagement patterns. Direction modifiers are computed separately and reported alongside the type. No empirical weighting (that needs pilot data we do not have).</p>
      <h2>The affirming scope limit</h2>
      <p>Arcus measures the <strong>affirming range</strong> of each construct. It cannot detect rumination, anxiety, hopelessness, hubristic pride, or other maladaptive patterns. This is a consumer product for self-discovery, not a clinical screen. The scope limit is stated on every result screen.</p>
      <h2>Why not MBTI?</h2>
      <p>MBTI dichotomizes continuous dimensions into binary types, discarding about 26-32% of information (McCrae & Costa, 1989). It creates a false cliff at the midpoint. Arcus reports continuous scores with graduated readings, not binary boxes.</p>
      <h2>The synthesis</h2>
      <p>The cross-test synthesis (reading the four internal gaps together as a self-congruence profile) is <strong>exploratory and unvalidated</strong>. It makes no new construct claim. It is a computed pattern, presented as an additional integration layer, not as the suite's primary payoff.</p>
      <h2>What we label as our synthesis</h2>
      <ul>
        <li>The trajectory component (SCA) is our synthesis, grounded in Carver-Scheier self-regulation.</li>
        <li>The decision-style preference battery (MMA) measures preference, not full heuristic deployment.</li>
        <li>The four-component Pride profile (clarity + authenticity + commitment + visibility) is our synthesis.</li>
        <li>The four-stance temporal typology (PTA) is our synthesis, grounded in Carstensen's perceived time horizons.</li>
      </ul>
      <div style="margin-top:2rem"><button class="btn btn-primary" onclick="route('research')">Read the research →</button></div>
    </div>
  </div>`;
}

    {q:'How long does it take?',a:'Each test takes 6-8 minutes. You can take one test at a time. The full suite is about 30 minutes, but you do not need to take all four.'},
    {q:'Can I retake a test?',a:'Yes. Your previous result is replaced when you retake. Your history is tracked in your profile.'},
    {q:'What does "trajectory" mean?',a:'Every Arcus result includes not just where you are (your position) but which direction you are heading (your trajectory). Your energy might be waxing. Your identity might be provisional. That direction is the arc.'},
    {q:'Is my data stored anywhere?',a:'Your results are stored only in your browser (localStorage). Nothing is sent to a server. Clearing your browser data clears your Arcus profile.'},

function pageProfile(){
  const d=S.load();const done=S.done();
  let cards=Object.entries(D).map(([k,t])=>{

  return `<div class="wrap" style="max-width:720px">
    <div class="page-hero"><h1>Your arcs</h1><p style="color:var(--ink-2)">${done===4?'All four dimensions traced.':`${4-done} arc${4-done===1?'':'s'} remaining.`}</p></div>

function showResult(key){const d=S.load();if(d[key])render('results',key);}

// ─── QUIZ ENGINE ───
function startQuiz(key){
  const t=D[key];
  quiz={test:key,idx:0,phase:'main',resp:new Array(t.items_data.length).fill(null),extra:[]};
  render('quiz',key);
}
function selAns(v){if(quiz.phase==='main')quiz.resp[quiz.idx]=v;else quiz.extra[quiz.idx]=v;render('quiz',quiz.test);}
function selStance(v){quiz.extra[0]=v;render('quiz',quiz.test);}
function nextQ(){
  const t=D[quiz.test];
  const items=quiz.phase==='main'?t.items_data:(t.extra?t.extra.items:[]);
  if(quiz.idx<items.length-1){quiz.idx++;render('quiz',quiz.test);}
  else{
    if(quiz.phase==='main'&&t.extra){quiz.phase='extra';quiz.idx=0;quiz.extra=new Array(t.extra.items.length).fill(null);render('quiz',quiz.test);}
    else finishQuiz();
  }
}
function prevQ(){
  if(quiz.phase==='extra'&&quiz.idx===0){quiz.phase='main';quiz.idx=D[quiz.test].items_data.length-1;render('quiz',quiz.test);return;}
  if(quiz.idx>0)quiz.idx--;
  render('quiz',quiz.test);
}
function finishQuiz(){
  const t=D[quiz.test];let r;
  if(t.extra){if(t.extra.type==='stance')r=t.score(quiz.resp,quiz.extra[0]);else r=t.score(quiz.resp,quiz.extra);}
  else r=t.score(quiz.resp);
  S.save(quiz.test,r);render('results',quiz.test);
}

// ─── SHARE ───
function share(key){
  const d=S.load(),e=d[key];if(!e)return;
  const t=D[key],r=e.r;
  document.getElementById('modal-card').innerHTML=`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div style="font-size:3rem">${r.emoji}</div>
    <div style="font-family:var(--display);font-size:1.5rem;font-weight:800;color:${t.color}">${r.type}</div>
    <div style="font-size:0.75rem;font-weight:700;color:var(--brand-2);text-transform:uppercase;letter-spacing:0.1em;margin-top:0.3rem">Arcus: ${t.name}</div>
    <div style="font-size:0.85rem;font-style:italic;color:var(--ink-2);margin:0.75rem 0 1rem">You are the arc.</div>
    <div style="padding:0.6rem;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r-sm);font-family:monospace;font-size:0.75rem;color:var(--ink-2);text-align:center;cursor:pointer;margin-bottom:1rem" onclick="navigator.clipboard?.writeText('I got ${r.type} on Arcus: ${t.name}. You are the arc.')">Tap to copy</div>
    <button class="btn btn-primary" style="width:100%" onclick="closeModal()">Done</button>`;
  document.getElementById('modal-bg').classList.add('active');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('active');}

// ─── KEYBOARD ───
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  const app=document.getElementById('app');
  if(app.querySelector('.quiz-shell')){
    const t=D[quiz.test];if(!t)return;
    const n=parseInt(e.key);
    const pts=quiz.phase==='main'?(quiz.test==='solstice'||quiz.test==='pride'?7:5):(t.extra&&t.extra.type==='bipolar'?7:5);
    if(n>=1&&n<=pts){selAns(n);}
    if(e.key==='Enter'){const b=document.getElementById('q-next');if(b&&!b.disabled){e.preventDefault();b.click();}}
  }
});

// ─── INIT ───
route('home');
</script>
