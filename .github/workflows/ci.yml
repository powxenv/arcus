# Quality gate — fast, free, runs on every PR and on every push to the integration branch.
# This is the primary merge gate (typecheck + production build + unit tests).
# Docs/research/plan-only changes are skipped automatically.
name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'research/**'
      - 'testsprite-plans/**'
      - 'testsprite-backend/**'
      - '.agents/**'
      - '.vscode/**'
      - '.codex/**'
      - 'LICENSE'
  push:
    branches: [main]   # integration branch
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'research/**'
      - 'testsprite-plans/**'
      - 'testsprite-backend/**'
      - '.agents/**'
      - '.vscode/**'
      - '.codex/**'
      - 'LICENSE'

permissions:
  contents: read

# On PRs, a new push cancels the in-flight run (cheap, churny). On the integration branch, let it finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck · Build · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        # tsconfig has noEmit:true; --noEmit is explicit for clarity.
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test
